zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 8d6f0eb0e0a4479e9d9dfbe3b3f6b2c1
      name: Templates/Power
  templates:
    - uuid: 3f1b8a2c9d4e4b7a8c152e6f9a0b1c23
      template: 'BKT MSPDU PDU by SNMP'
      description: |
        ## Overview
        
        The template monitors BKT MSPDU rack power distribution units (up to 24 switched outlets) by SNMP.
        
        It collects device inventory data, line parameters of phase 1 (voltage, current, power, power factor, energy),
        two external temperature/humidity sensors and per-outlet metrics discovered by low-level discovery.
        
        Enterprise OID: 1.3.6.1.4.1.47394.7.1
        
        ## Requirements
        
        SNMP agent (v1/v2c/v3) must be enabled on the PDU and reachable from the Zabbix server or proxy.
        
        ## Setup
        
        1. Link the template to the host, set the SNMP interface and the {$SNMP_COMMUNITY} macro.
        2. Adjust {$MSPDU.PHASE.CURRENT.MAX} to the rated input current of the PDU.
        3. Set {$MSPDU.SENSOR1.ENABLED} / {$MSPDU.SENSOR2.ENABLED} to 0 for sensors that are not physically connected.
        4. Optionally set per-outlet thresholds using macro context, for example {$MSPDU.OUTLET.POWER.MIN:"3"} = 30.
        
        ## How it works
        
        - Outlets are discovered by a JavaScript parser of the raw SNMP walk of outlet names.
          Outlets named "--" or with an empty name are skipped.
        - Outlet name, current, switch state, power factor and energy are dependent items of the raw walk items.
        - Outlet power (W) is a calculated item: current x phase voltage x power factor, rounded to whole watts.
        
        ## Known issues
        
        If the PDU does not measure per-outlet current (constant 0 A), set {$MSPDU.OUTLET.CURRENT.MAX} = 0
        to silence the outlet current triggers. In that case the calculated outlet power is always 0 as well.
      groups:
        - name: Templates/Power
      items:
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2c08
          name: 'Buzzer switch'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.47394.7.1.1.9.0
          key: mspdu.device.buzzer
          delay: 15m
          history: 7d
          value_type: CHAR
          description: 'State of the built-in acoustic alarm.'
          tags:
            - tag: component
              value: device
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2c01
          name: 'Device name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.47394.7.1.1.1.0
          key: mspdu.device.name
          delay: 15m
          history: 7d
          value_type: CHAR
          triggers:
            - uuid: a1f0c2b34d5e4f6a8b9c0d1e2f3a4b0c
              expression: 'last(/BKT MSPDU PDU by SNMP/mspdu.device.name,#1)<>last(/BKT MSPDU PDU by SNMP/mspdu.device.name,#2) and length(last(/BKT MSPDU PDU by SNMP/mspdu.device.name))>0'
              name: 'Device name has changed'
              priority: INFO
              description: 'The device name has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
          tags:
            - tag: component
              value: device
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2c07
          name: 'Device uptime (raw)'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.47394.7.1.1.8.0
          key: mspdu.device.uptime
          delay: 5m
          history: 7d
          value_type: CHAR
          description: 'Uptime reported by the PDU as text. Used as a master item for the numeric uptime.'
          tags:
            - tag: component
              value: device
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2c05
          name: 'Firmware version'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.47394.7.1.1.5.0
          key: mspdu.device.firmware
          delay: 1h
          history: 30d
          value_type: CHAR
          triggers:
            - uuid: a1f0c2b34d5e4f6a8b9c0d1e2f3a4b0b
              expression: 'last(/BKT MSPDU PDU by SNMP/mspdu.device.firmware,#1)<>last(/BKT MSPDU PDU by SNMP/mspdu.device.firmware,#2) and length(last(/BKT MSPDU PDU by SNMP/mspdu.device.firmware))>0'
              name: 'Firmware version has changed'
              event_name: 'Firmware version has changed to {ITEM.VALUE1}'
              priority: INFO
              description: 'The firmware version has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
          tags:
            - tag: component
              value: device
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2c06
          name: 'Line frequency'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.47394.7.1.1.6.0
          key: mspdu.device.frequency
          delay: 5m
          history: 7d
          value_type: FLOAT
          trends: 90d
          units: Hz
          triggers:
            - uuid: d4e5f6a7b8c9401a8b3c4d5e6f701101
              expression: 'min(/BKT MSPDU PDU by SNMP/mspdu.device.frequency,10m)<{$MSPDU.FREQ.MIN} and min(/BKT MSPDU PDU by SNMP/mspdu.device.frequency,10m)>0'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'min(/BKT MSPDU PDU by SNMP/mspdu.device.frequency,10m)>{$MSPDU.FREQ.MIN}+0.2'
              name: 'Line frequency is too low (below {$MSPDU.FREQ.MIN}Hz)'
              event_name: 'Line frequency is too low ({ITEM.VALUE1})'
              priority: WARNING
              description: 'Typical when the PDU is running on a generator or with an unstable grid.'
              tags:
                - tag: scope
                  value: power
              dependencies:
                - name: 'PDU is unavailable by SNMP'
                  expression: 'nodata(/BKT MSPDU PDU by SNMP/mspdu.phase1.current,{$MSPDU.NODATA})=1'
            - uuid: d4e5f6a7b8c9401a8b3c4d5e6f701102
              expression: 'max(/BKT MSPDU PDU by SNMP/mspdu.device.frequency,10m)>{$MSPDU.FREQ.MAX}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/BKT MSPDU PDU by SNMP/mspdu.device.frequency,10m)<{$MSPDU.FREQ.MAX}-0.2'
              name: 'Line frequency is too high (over {$MSPDU.FREQ.MAX}Hz)'
              event_name: 'Line frequency is too high ({ITEM.VALUE1})'
              priority: WARNING
              tags:
                - tag: scope
                  value: power
              dependencies:
                - name: 'PDU is unavailable by SNMP'
                  expression: 'nodata(/BKT MSPDU PDU by SNMP/mspdu.phase1.current,{$MSPDU.NODATA})=1'
          tags:
            - tag: component
              value: device
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2c04
          name: 'MAC address'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.47394.7.1.1.4.0
          key: mspdu.device.mac
          delay: 1h
          history: 30d
          value_type: CHAR
          tags:
            - tag: component
              value: device
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2c03
          name: 'Number of output ports'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.47394.7.1.1.3.0
          key: mspdu.device.output.number
          delay: 1h
          history: 30d
          trends: '0'
          tags:
            - tag: component
              value: device
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2d01
          name: 'Number of phases'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.47394.7.1.2.0
          key: mspdu.phase.count
          delay: 1h
          history: 30d
          value_type: CHAR
          tags:
            - tag: component
              value: phase
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2f02
          name: 'Outlets: Get current'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.47394.7.1.8.1]'
          key: mspdu.walk.outlet.current.raw
          delay: 1m
          history: '0'
          value_type: TEXT
          description: 'Raw SNMP walk of per-outlet current. Master item for dependent items.'
          tags:
            - tag: component
              value: raw
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2f12
          name: 'Outlets: Get energy'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.47394.7.1.10]'
          key: mspdu.walk.outlet.energy.raw
          delay: 5m
          history: '0'
          value_type: TEXT
          description: 'Raw SNMP walk of per-outlet energy counters. Master item for dependent items.'
          tags:
            - tag: component
              value: raw
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2f01
          name: 'Outlets: Get names'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.47394.7.1.5]'
          key: mspdu.walk.outlet.names.raw
          delay: 1h
          history: '0'
          value_type: TEXT
          description: 'Raw SNMP walk of outlet names. Master item for discovery and dependent items.'
          tags:
            - tag: component
              value: raw
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2f11
          name: 'Outlets: Get power factor'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.47394.7.1.9]'
          key: mspdu.walk.outlet.pf.raw
          delay: 1m
          history: '0'
          value_type: TEXT
          description: 'Raw SNMP walk of per-outlet power factor. Master item for dependent items.'
          tags:
            - tag: component
              value: raw
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2f07
          name: 'Outlets: Get switch state'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.47394.7.1.7]'
          key: mspdu.walk.outlet.switch.raw
          delay: 1m
          history: '0'
          value_type: TEXT
          description: 'Raw SNMP walk of per-outlet switch state. Master item for dependent items.'
          tags:
            - tag: component
              value: raw
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2c02
          name: 'PDU type'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.47394.7.1.1.2.0
          key: mspdu.device.type
          delay: 15m
          history: 7d
          value_type: CHAR
          tags:
            - tag: component
              value: device
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2d11
          name: 'Phase 1: Current'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.47394.7.1.2.1.1.0
          key: mspdu.phase1.current
          delay: 1m
          history: 7d
          value_type: FLOAT
          trends: 90d
          units: A
          triggers:
            - uuid: a1f0c2b34d5e4f6a8b9c0d1e2f3a4b01
              expression: 'nodata(/BKT MSPDU PDU by SNMP/mspdu.phase1.current,{$MSPDU.NODATA})=1'
              name: 'PDU is unavailable by SNMP'
              priority: HIGH
              description: 'No SNMP response: power loss, network failure or PDU controller fault.'
              tags:
                - tag: scope
                  value: availability
            - uuid: a1f0c2b34d5e4f6a8b9c0d1e2f3a4b03
              expression: 'min(/BKT MSPDU PDU by SNMP/mspdu.phase1.current,3m)>{$MSPDU.PHASE.CURRENT.MAX}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/BKT MSPDU PDU by SNMP/mspdu.phase1.current,5m)<{$MSPDU.PHASE.CURRENT.MAX}*0.9'
              name: 'Phase 1: Current is critically high (over {$MSPDU.PHASE.CURRENT.MAX}A)'
              event_name: 'Phase 1: Current is critically high ({ITEM.VALUE1})'
              priority: HIGH
              description: 'Risk of tripping the PDU overcurrent protection.'
              tags:
                - tag: scope
                  value: capacity
              dependencies:
                - name: 'PDU is unavailable by SNMP'
                  expression: 'nodata(/BKT MSPDU PDU by SNMP/mspdu.phase1.current,{$MSPDU.NODATA})=1'
            - uuid: a1f0c2b34d5e4f6a8b9c0d1e2f3a4b02
              expression: 'min(/BKT MSPDU PDU by SNMP/mspdu.phase1.current,5m)>{$MSPDU.PHASE.CURRENT.MAX}*0.8'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/BKT MSPDU PDU by SNMP/mspdu.phase1.current,5m)<{$MSPDU.PHASE.CURRENT.MAX}*0.75'
              name: 'Phase 1: Current is high (over 80% of {$MSPDU.PHASE.CURRENT.MAX}A)'
              event_name: 'Phase 1: Current is high ({ITEM.VALUE1})'
              priority: WARNING
              tags:
                - tag: scope
                  value: capacity
              dependencies:
                - name: 'Phase 1: Current is critically high (over {$MSPDU.PHASE.CURRENT.MAX}A)'
                  expression: 'min(/BKT MSPDU PDU by SNMP/mspdu.phase1.current,3m)>{$MSPDU.PHASE.CURRENT.MAX}'
                  recovery_expression: 'max(/BKT MSPDU PDU by SNMP/mspdu.phase1.current,5m)<{$MSPDU.PHASE.CURRENT.MAX}*0.9'
                - name: 'PDU is unavailable by SNMP'
                  expression: 'nodata(/BKT MSPDU PDU by SNMP/mspdu.phase1.current,{$MSPDU.NODATA})=1'
          tags:
            - tag: component
              value: phase1
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2d15
          name: 'Phase 1: Energy'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.47394.7.1.2.1.5.0
          key: mspdu.phase1.energy
          delay: 5m
          history: 30d
          value_type: FLOAT
          units: kWh
          tags:
            - tag: component
              value: phase1
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2d13
          name: 'Phase 1: Power'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.47394.7.1.2.1.3.0
          key: mspdu.phase1.power
          delay: 1m
          history: 7d
          value_type: FLOAT
          trends: 90d
          units: W
          tags:
            - tag: component
              value: phase1
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2d14
          name: 'Phase 1: Power factor'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.47394.7.1.2.1.4.0
          key: mspdu.phase1.pf
          delay: 1m
          history: 7d
          value_type: FLOAT
          trends: 90d
          triggers:
            - uuid: a1f0c2b34d5e4f6a8b9c0d1e2f3a4b09
              expression: 'avg(/BKT MSPDU PDU by SNMP/mspdu.phase1.pf,15m)<{$MSPDU.PF.MIN} and min(/BKT MSPDU PDU by SNMP/mspdu.phase1.current,15m)>{$MSPDU.PF.CURRENT.MIN}'
              name: 'Phase 1: Power factor is low (below {$MSPDU.PF.MIN})'
              priority: INFO
              description: 'The power factor is evaluated only when the current is above {$MSPDU.PF.CURRENT.MIN} A. With no load PF=0 is normal.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: power
              dependencies:
                - name: 'PDU is unavailable by SNMP'
                  expression: 'nodata(/BKT MSPDU PDU by SNMP/mspdu.phase1.current,{$MSPDU.NODATA})=1'
          tags:
            - tag: component
              value: phase1
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2d12
          name: 'Phase 1: Voltage'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.47394.7.1.2.1.2.0
          key: mspdu.phase1.voltage
          delay: 1m
          history: 7d
          value_type: FLOAT
          trends: 90d
          units: V
          triggers:
            - uuid: a1f0c2b34d5e4f6a8b9c0d1e2f3a4b04
              expression: 'max(/BKT MSPDU PDU by SNMP/mspdu.phase1.voltage,5m)<{$MSPDU.VOLTAGE.MIN.CRIT}'
              name: 'Phase 1: Voltage is critically low (below {$MSPDU.VOLTAGE.MIN.CRIT}V)'
              event_name: 'Phase 1: Voltage is critically low ({ITEM.VALUE1})'
              priority: HIGH
              tags:
                - tag: scope
                  value: power
              dependencies:
                - name: 'PDU is unavailable by SNMP'
                  expression: 'nodata(/BKT MSPDU PDU by SNMP/mspdu.phase1.current,{$MSPDU.NODATA})=1'
            - uuid: a1f0c2b34d5e4f6a8b9c0d1e2f3a4b05
              expression: 'avg(/BKT MSPDU PDU by SNMP/mspdu.phase1.voltage,5m)<{$MSPDU.VOLTAGE.MIN.WARN}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'avg(/BKT MSPDU PDU by SNMP/mspdu.phase1.voltage,5m)>{$MSPDU.VOLTAGE.MIN.WARN}+3'
              name: 'Phase 1: Voltage is low (below {$MSPDU.VOLTAGE.MIN.WARN}V)'
              event_name: 'Phase 1: Voltage is low ({ITEM.VALUE1})'
              priority: WARNING
              tags:
                - tag: scope
                  value: power
              dependencies:
                - name: 'Phase 1: Voltage is critically low (below {$MSPDU.VOLTAGE.MIN.CRIT}V)'
                  expression: 'max(/BKT MSPDU PDU by SNMP/mspdu.phase1.voltage,5m)<{$MSPDU.VOLTAGE.MIN.CRIT}'
            - uuid: a1f0c2b34d5e4f6a8b9c0d1e2f3a4b07
              expression: 'min(/BKT MSPDU PDU by SNMP/mspdu.phase1.voltage,3m)>{$MSPDU.VOLTAGE.MAX.CRIT}'
              name: 'Phase 1: Voltage is critically high (over {$MSPDU.VOLTAGE.MAX.CRIT}V)'
              event_name: 'Phase 1: Voltage is critically high ({ITEM.VALUE1})'
              priority: HIGH
              description: 'Risk of damaging the power supplies of the devices installed in the rack.'
              tags:
                - tag: scope
                  value: power
              dependencies:
                - name: 'PDU is unavailable by SNMP'
                  expression: 'nodata(/BKT MSPDU PDU by SNMP/mspdu.phase1.current,{$MSPDU.NODATA})=1'
            - uuid: a1f0c2b34d5e4f6a8b9c0d1e2f3a4b06
              expression: 'avg(/BKT MSPDU PDU by SNMP/mspdu.phase1.voltage,5m)>{$MSPDU.VOLTAGE.MAX.WARN}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'avg(/BKT MSPDU PDU by SNMP/mspdu.phase1.voltage,5m)<{$MSPDU.VOLTAGE.MAX.WARN}-3'
              name: 'Phase 1: Voltage is high (over {$MSPDU.VOLTAGE.MAX.WARN}V)'
              event_name: 'Phase 1: Voltage is high ({ITEM.VALUE1})'
              priority: WARNING
              tags:
                - tag: scope
                  value: power
              dependencies:
                - name: 'Phase 1: Voltage is critically high (over {$MSPDU.VOLTAGE.MAX.CRIT}V)'
                  expression: 'min(/BKT MSPDU PDU by SNMP/mspdu.phase1.voltage,3m)>{$MSPDU.VOLTAGE.MAX.CRIT}'
          tags:
            - tag: component
              value: phase1
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2e03
          name: 'Sensor 1: Humidity'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.47394.7.1.4.3.0
          key: mspdu.sensor.hum1
          delay: 1m
          history: 7d
          value_type: FLOAT
          trends: 90d
          units: '%'
          triggers:
            - uuid: c3a17f402b6d4e9d8a5b1c7e9f204a05
              expression: 'avg(/BKT MSPDU PDU by SNMP/mspdu.sensor.hum1,10m)>{$MSPDU.OUTLET.HUM.MAX} and {$MSPDU.SENSOR1.ENABLED}=1'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/BKT MSPDU PDU by SNMP/mspdu.sensor.hum1,10m)<{$MSPDU.OUTLET.HUM.MAX}-5'
              name: 'Sensor 1: Humidity is too high (over {$MSPDU.OUTLET.HUM.MAX}%)'
              event_name: 'Sensor 1: Humidity is too high ({ITEM.VALUE1})'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: humidity
            - uuid: c3a17f402b6d4e9d8a5b1c7e9f204a06
              expression: 'avg(/BKT MSPDU PDU by SNMP/mspdu.sensor.hum1,10m)<{$MSPDU.HUM.MIN} and {$MSPDU.SENSOR1.ENABLED}=1'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'min(/BKT MSPDU PDU by SNMP/mspdu.sensor.hum1,10m)>{$MSPDU.HUM.MIN}+5'
              name: 'Sensor 1: Humidity is too low (below {$MSPDU.HUM.MIN}%)'
              event_name: 'Sensor 1: Humidity is too low ({ITEM.VALUE1})'
              priority: WARNING
              tags:
                - tag: scope
                  value: humidity
          tags:
            - tag: component
              value: sensor1
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2e01
          name: 'Sensor 1: Temperature'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.47394.7.1.4.1.0
          key: mspdu.sensor.temp1
          delay: 1m
          history: 7d
          value_type: FLOAT
          trends: 90d
          units: °C
          triggers:
            - uuid: c3a17f402b6d4e9d8a5b1c7e9f204a01
              expression: 'avg(/BKT MSPDU PDU by SNMP/mspdu.sensor.temp1,5m)>{$MSPDU.OUTLET.TEMP.MAX} and {$MSPDU.SENSOR1.ENABLED}=1'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/BKT MSPDU PDU by SNMP/mspdu.sensor.temp1,5m)<{$MSPDU.OUTLET.TEMP.MAX}-2'
              name: 'Sensor 1: Temperature is too high (over {$MSPDU.OUTLET.TEMP.MAX}°C)'
              event_name: 'Sensor 1: Temperature is too high ({ITEM.VALUE1})'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: temperature
            - uuid: c3a17f402b6d4e9d8a5b1c7e9f204a02
              expression: 'avg(/BKT MSPDU PDU by SNMP/mspdu.sensor.temp1,5m)<{$MSPDU.OUTLET.TEMP.MIN} and {$MSPDU.SENSOR1.ENABLED}=1'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'min(/BKT MSPDU PDU by SNMP/mspdu.sensor.temp1,5m)>{$MSPDU.OUTLET.TEMP.MIN}+2'
              name: 'Sensor 1: Temperature is too low (below {$MSPDU.OUTLET.TEMP.MIN}°C)'
              event_name: 'Sensor 1: Temperature is too low ({ITEM.VALUE1})'
              priority: WARNING
              tags:
                - tag: scope
                  value: temperature
          tags:
            - tag: component
              value: sensor1
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2e04
          name: 'Sensor 2: Humidity'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.47394.7.1.4.4.0
          key: mspdu.sensor.hum2
          delay: 1m
          history: 7d
          value_type: FLOAT
          trends: 90d
          units: '%'
          triggers:
            - uuid: c3a17f402b6d4e9d8a5b1c7e9f204a07
              expression: 'avg(/BKT MSPDU PDU by SNMP/mspdu.sensor.hum2,10m)>{$MSPDU.OUTLET.HUM.MAX} and {$MSPDU.SENSOR2.ENABLED}=1'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/BKT MSPDU PDU by SNMP/mspdu.sensor.hum2,10m)<{$MSPDU.OUTLET.HUM.MAX}-5'
              name: 'Sensor 2: Humidity is too high (over {$MSPDU.OUTLET.HUM.MAX}%)'
              event_name: 'Sensor 2: Humidity is too high ({ITEM.VALUE1})'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: humidity
            - uuid: c3a17f402b6d4e9d8a5b1c7e9f204a08
              expression: 'avg(/BKT MSPDU PDU by SNMP/mspdu.sensor.hum2,10m)<{$MSPDU.HUM.MIN} and {$MSPDU.SENSOR2.ENABLED}=1'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'min(/BKT MSPDU PDU by SNMP/mspdu.sensor.hum2,10m)>{$MSPDU.HUM.MIN}+5'
              name: 'Sensor 2: Humidity is too low (below {$MSPDU.HUM.MIN}%)'
              event_name: 'Sensor 2: Humidity is too low ({ITEM.VALUE1})'
              priority: WARNING
              tags:
                - tag: scope
                  value: humidity
          tags:
            - tag: component
              value: sensor2
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2e02
          name: 'Sensor 2: Temperature'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.47394.7.1.4.2.0
          key: mspdu.sensor.temp2
          delay: 1m
          history: 7d
          value_type: FLOAT
          trends: 90d
          units: °C
          triggers:
            - uuid: c3a17f402b6d4e9d8a5b1c7e9f204a03
              expression: 'avg(/BKT MSPDU PDU by SNMP/mspdu.sensor.temp2,5m)>{$MSPDU.OUTLET.TEMP.MAX} and {$MSPDU.SENSOR2.ENABLED}=1'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/BKT MSPDU PDU by SNMP/mspdu.sensor.temp2,5m)<{$MSPDU.OUTLET.TEMP.MAX}-2'
              name: 'Sensor 2: Temperature is too high (over {$MSPDU.OUTLET.TEMP.MAX}°C)'
              event_name: 'Sensor 2: Temperature is too high ({ITEM.VALUE1})'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: temperature
            - uuid: c3a17f402b6d4e9d8a5b1c7e9f204a04
              expression: 'avg(/BKT MSPDU PDU by SNMP/mspdu.sensor.temp2,5m)<{$MSPDU.OUTLET.TEMP.MIN} and {$MSPDU.SENSOR2.ENABLED}=1'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'min(/BKT MSPDU PDU by SNMP/mspdu.sensor.temp2,5m)>{$MSPDU.OUTLET.TEMP.MIN}+2'
              name: 'Sensor 2: Temperature is too low (below {$MSPDU.OUTLET.TEMP.MIN}°C)'
              event_name: 'Sensor 2: Temperature is too low ({ITEM.VALUE1})'
              priority: WARNING
              tags:
                - tag: scope
                  value: temperature
          tags:
            - tag: component
              value: sensor2
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2c09
          name: 'Uptime'
          type: DEPENDENT
          key: mspdu.device.uptime.sec
          history: 30d
          units: uptime
          description: 'Converts the textual uptime into seconds, which makes it possible to detect a PDU restart.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var s = String(value).trim();
                  var d = 0, h = 0, mi = 0, se = 0;
                  var md = s.match(/(\d+)\s*(?:d|day|days|dni|dzien|dzie)/i);
                  if (md) { d = parseInt(md[1], 10); }
                  var mt = s.match(/(\d+)\s*:\s*(\d+)\s*:\s*(\d+)/);
                  if (mt) {
                      h = parseInt(mt[1], 10); mi = parseInt(mt[2], 10); se = parseInt(mt[3], 10);
                  } else {
                      var mh = s.match(/(\d+)\s*(?:h|hour|godz)/i); if (mh) h = parseInt(mh[1], 10);
                      var mm = s.match(/(\d+)\s*(?:m|min)/i);        if (mm) mi = parseInt(mm[1], 10);
                      var ms = s.match(/(\d+)\s*(?:s|sec)/i);        if (ms) se = parseInt(ms[1], 10);
                  }
                  var total = d * 86400 + h * 3600 + mi * 60 + se;
                  if (total === 0 && /^\d+$/.test(s)) { total = parseInt(s, 10); }
                  return total;
          master_item:
            key: mspdu.device.uptime
          triggers:
            - uuid: d4e5f6a7b8c9401a8b3c4d5e6f701103
              expression: 'last(/BKT MSPDU PDU by SNMP/mspdu.device.uptime.sec)<last(/BKT MSPDU PDU by SNMP/mspdu.device.uptime.sec,#2) and last(/BKT MSPDU PDU by SNMP/mspdu.device.uptime.sec)<{$MSPDU.UPTIME.RESTART}'
              name: 'PDU has been restarted'
              event_name: 'PDU has been restarted (uptime {ITEM.VALUE1})'
              priority: WARNING
              description: 'The uptime counter has dropped. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
          tags:
            - tag: component
              value: device
      discovery_rules:
        - uuid: 1b2c3d4e5f6a4b7c9d8e9f0a1b2c3d01
          name: 'Outlet discovery'
          type: DEPENDENT
          key: mspdu.outlet.discovery
          description: |
            Discovery of the PDU outlets based on the raw SNMP walk of outlet names.
            Outlets named "--" or with an empty name are skipped.
            LLD macros: {#OUTLET_INDEX}, {#OUTLET_NAME}
          item_prototypes:
            - uuid: 2c3d4e5f6a7b4c8d9e0f1a2b3c4d5e02
              name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): Current'
              type: DEPENDENT
              key: 'mspdu.outlet.current[{#OUTLET_INDEX}]'
              history: 7d
              value_type: FLOAT
              trends: 90d
              units: A
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var lines = value.split('\n');
                      var idx = '{#OUTLET_INDEX}';
                      var re = new RegExp('\\.8\\.1\\.' + idx + '\\.0\\s*=\\s*STRING:\\s*"([^"]*)"');
                      for (var i = 0; i < lines.length; i++) {
                          var m = lines[i].match(re);
                          if (m) {
                              if (m[1] === '--') return 0;
                              var v = parseFloat(m[1]);
                              return isNaN(v) ? 0 : v;
                          }
                      }
                      return 0;
              master_item:
                key: mspdu.walk.outlet.current.raw
              trigger_prototypes:
                - uuid: b2e1d3c45f6a4b7c8d9e0f1a2b3c4d04
                  expression: '{$MSPDU.OUTLET.CURRENT.MAX:"{#OUTLET_INDEX}"}>0 and min(/BKT MSPDU PDU by SNMP/mspdu.outlet.current[{#OUTLET_INDEX}],3m)>{$MSPDU.OUTLET.CURRENT.MAX:"{#OUTLET_INDEX}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/BKT MSPDU PDU by SNMP/mspdu.outlet.current[{#OUTLET_INDEX}],5m)<{$MSPDU.OUTLET.CURRENT.MAX:"{#OUTLET_INDEX}"}*0.9'
                  name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): Current is critically high'
                  event_name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): Current is critically high ({ITEM.VALUE1})'
                  priority: HIGH
                  description: 'The outlet current exceeds {$MSPDU.OUTLET.CURRENT.MAX:"{#OUTLET_INDEX}"} A.'
                  tags:
                    - tag: scope
                      value: capacity
                  dependencies:
                    - name: 'PDU is unavailable by SNMP'
                      expression: 'nodata(/BKT MSPDU PDU by SNMP/mspdu.phase1.current,{$MSPDU.NODATA})=1'
                - uuid: b2e1d3c45f6a4b7c8d9e0f1a2b3c4d03
                  expression: '{$MSPDU.OUTLET.CURRENT.MAX:"{#OUTLET_INDEX}"}>0 and min(/BKT MSPDU PDU by SNMP/mspdu.outlet.current[{#OUTLET_INDEX}],5m)>{$MSPDU.OUTLET.CURRENT.MAX:"{#OUTLET_INDEX}"}*0.8'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/BKT MSPDU PDU by SNMP/mspdu.outlet.current[{#OUTLET_INDEX}],5m)<{$MSPDU.OUTLET.CURRENT.MAX:"{#OUTLET_INDEX}"}*0.75'
                  name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): Current is high (over 80% of the limit)'
                  event_name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): Current is high ({ITEM.VALUE1})'
                  priority: WARNING
                  tags:
                    - tag: scope
                      value: capacity
                  dependencies:
                    - name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): Current is critically high'
                      expression: '{$MSPDU.OUTLET.CURRENT.MAX:"{#OUTLET_INDEX}"}>0 and min(/BKT MSPDU PDU by SNMP/mspdu.outlet.current[{#OUTLET_INDEX}],3m)>{$MSPDU.OUTLET.CURRENT.MAX:"{#OUTLET_INDEX}"}'
                      recovery_expression: 'max(/BKT MSPDU PDU by SNMP/mspdu.outlet.current[{#OUTLET_INDEX}],5m)<{$MSPDU.OUTLET.CURRENT.MAX:"{#OUTLET_INDEX}"}*0.9'
                    - name: 'PDU is unavailable by SNMP'
                      expression: 'nodata(/BKT MSPDU PDU by SNMP/mspdu.phase1.current,{$MSPDU.NODATA})=1'
              tags:
                - tag: component
                  value: outlet
                - tag: outlet
                  value: '{#OUTLET_INDEX}'
            - uuid: 2c3d4e5f6a7b4c8d9e0f1a2b3c4d5e12
              name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): Energy'
              type: DEPENDENT
              key: 'mspdu.outlet.energy[{#OUTLET_INDEX}]'
              history: 30d
              value_type: FLOAT
              units: kWh
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var lines = value.split('\n');
                      var idx = '{#OUTLET_INDEX}';
                      var re = new RegExp('\\.10\\.' + idx + '\\.0\\s*=\\s*STRING:\\s*"([^"]*)"');
                      for (var i = 0; i < lines.length; i++) {
                          var m = lines[i].match(re);
                          if (m) {
                              if (m[1] === '--') return 0;
                              var v = parseFloat(m[1]);
                              return isNaN(v) ? 0 : v;
                          }
                      }
                      return 0;
              master_item:
                key: mspdu.walk.outlet.energy.raw
              trigger_prototypes:
                - uuid: b2e1d3c45f6a4b7c8d9e0f1a2b3c4d07
                  expression: 'change(/BKT MSPDU PDU by SNMP/mspdu.outlet.energy[{#OUTLET_INDEX}])<0'
                  name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): Energy counter has been reset'
                  priority: INFO
                  description: 'The energy counter of the outlet has decreased. Acknowledge to close the problem manually.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
              tags:
                - tag: component
                  value: outlet
                - tag: outlet
                  value: '{#OUTLET_INDEX}'
            - uuid: 2c3d4e5f6a7b4c8d9e0f1a2b3c4d5e01
              name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): Name'
              type: DEPENDENT
              key: 'mspdu.outlet.name[{#OUTLET_INDEX}]'
              history: 30d
              value_type: CHAR
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var lines = value.split('\n');
                      var idx = '{#OUTLET_INDEX}';
                      var re = new RegExp('\\.5\\.' + idx + '\\.0\\s*=\\s*STRING:\\s*"([^"]*)"');
                      for (var i = 0; i < lines.length; i++) {
                          var m = lines[i].match(re);
                          if (m) return m[1];
                      }
                      return '';
              master_item:
                key: mspdu.walk.outlet.names.raw
              tags:
                - tag: component
                  value: outlet
                - tag: outlet
                  value: '{#OUTLET_INDEX}'
            - uuid: 2c3d4e5f6a7b4c8d9e0f1a2b3c4d5e13
              name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): Power'
              type: CALCULATED
              key: 'mspdu.outlet.power.w[{#OUTLET_INDEX}]'
              delay: 1m
              history: 7d
              value_type: FLOAT
              trends: 90d
              units: W
              params: 'last(//mspdu.outlet.current[{#OUTLET_INDEX}]) * last(//mspdu.phase1.voltage) * last(//mspdu.outlet.pf[{#OUTLET_INDEX}])'
              description: |
                Instantaneous power of the outlet: current x phase voltage x power factor, rounded to whole watts.
                Note: if the PDU does not report the per-outlet current, this value is always 0.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = parseFloat(value);
                      if (isNaN(v)) return 0;
                      return Math.round(v);
              trigger_prototypes:
                - uuid: b2e1d3c45f6a4b7c8d9e0f1a2b3c4d09
                  expression: '{$MSPDU.OUTLET.POWER.MIN:"{#OUTLET_INDEX}"}>0 and max(/BKT MSPDU PDU by SNMP/mspdu.outlet.power.w[{#OUTLET_INDEX}],{$MSPDU.OUTLET.NOLOAD.PERIOD:"{#OUTLET_INDEX}"})<{$MSPDU.OUTLET.POWER.MIN:"{#OUTLET_INDEX}"} and last(/BKT MSPDU PDU by SNMP/mspdu.outlet.switch[{#OUTLET_INDEX}])="{$MSPDU.OUTLET.STATE.ON}"'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'min(/BKT MSPDU PDU by SNMP/mspdu.outlet.power.w[{#OUTLET_INDEX}],5m)>={$MSPDU.OUTLET.POWER.MIN:"{#OUTLET_INDEX}"}'
                  name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): No load while the outlet is switched on'
                  event_name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): No load ({ITEM.VALUE1}) while the outlet is switched on'
                  priority: WARNING
                  description: |
                    Probable power supply failure or the device has been disconnected.
                    Enable it per outlet: {$MSPDU.OUTLET.POWER.MIN:"{#OUTLET_INDEX}"} = for example 20 (W).
                    The value 0 disables the trigger.
                  tags:
                    - tag: scope
                      value: availability
                  dependencies:
                    - name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): Outlet is switched off'
                      expression: 'last(/BKT MSPDU PDU by SNMP/mspdu.outlet.switch[{#OUTLET_INDEX}])<>"{$MSPDU.OUTLET.STATE.ON}" and length(last(/BKT MSPDU PDU by SNMP/mspdu.outlet.switch[{#OUTLET_INDEX}]))>0 and {$MSPDU.OUTLET.OFF.ALERT:"{#OUTLET_INDEX}"}=1'
                    - name: 'PDU is unavailable by SNMP'
                      expression: 'nodata(/BKT MSPDU PDU by SNMP/mspdu.phase1.current,{$MSPDU.NODATA})=1'
                - uuid: b2e1d3c45f6a4b7c8d9e0f1a2b3c4d06
                  expression: '{$MSPDU.OUTLET.POWER.MAX:"{#OUTLET_INDEX}"}>0 and min(/BKT MSPDU PDU by SNMP/mspdu.outlet.power.w[{#OUTLET_INDEX}],5m)>{$MSPDU.OUTLET.POWER.MAX:"{#OUTLET_INDEX}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/BKT MSPDU PDU by SNMP/mspdu.outlet.power.w[{#OUTLET_INDEX}],5m)<{$MSPDU.OUTLET.POWER.MAX:"{#OUTLET_INDEX}"}*0.9'
                  name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): Power is too high'
                  event_name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): Power is too high ({ITEM.VALUE1})'
                  priority: WARNING
                  description: 'The outlet power exceeds {$MSPDU.OUTLET.POWER.MAX:"{#OUTLET_INDEX}"} W.'
                  tags:
                    - tag: scope
                      value: capacity
                  dependencies:
                    - name: 'PDU is unavailable by SNMP'
                      expression: 'nodata(/BKT MSPDU PDU by SNMP/mspdu.phase1.current,{$MSPDU.NODATA})=1'
              tags:
                - tag: component
                  value: outlet
                - tag: outlet
                  value: '{#OUTLET_INDEX}'
            - uuid: 2c3d4e5f6a7b4c8d9e0f1a2b3c4d5e07
              name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): Power factor'
              type: DEPENDENT
              key: 'mspdu.outlet.pf[{#OUTLET_INDEX}]'
              history: 7d
              value_type: FLOAT
              trends: 90d
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var lines = value.split('\n');
                      var idx = '{#OUTLET_INDEX}';
                      var re = new RegExp('\\.9\\.' + idx + '\\.0\\s*=\\s*STRING:\\s*"([^"]*)"');
                      for (var i = 0; i < lines.length; i++) {
                          var m = lines[i].match(re);
                          if (m) {
                              if (m[1] === '--') return 0;
                              var v = parseFloat(m[1]);
                              return isNaN(v) ? 0 : v;
                          }
                      }
                      return 0;
              master_item:
                key: mspdu.walk.outlet.pf.raw
              trigger_prototypes:
                - uuid: b2e1d3c45f6a4b7c8d9e0f1a2b3c4d08
                  expression: 'avg(/BKT MSPDU PDU by SNMP/mspdu.outlet.pf[{#OUTLET_INDEX}],15m)<{$MSPDU.OUTLET.PF.MIN} and min(/BKT MSPDU PDU by SNMP/mspdu.outlet.power.w[{#OUTLET_INDEX}],15m)>{$MSPDU.OUTLET.PF.POWER.MIN}'
                  name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): Power factor is low (below {$MSPDU.OUTLET.PF.MIN})'
                  priority: INFO
                  description: 'Evaluated only when the power is above {$MSPDU.OUTLET.PF.POWER.MIN} W. With no load PF=0 is normal.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: power
                  dependencies:
                    - name: 'PDU is unavailable by SNMP'
                      expression: 'nodata(/BKT MSPDU PDU by SNMP/mspdu.phase1.current,{$MSPDU.NODATA})=1'
              tags:
                - tag: component
                  value: outlet
                - tag: outlet
                  value: '{#OUTLET_INDEX}'
            - uuid: 2c3d4e5f6a7b4c8d9e0f1a2b3c4d5e09
              name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): Switch state'
              type: DEPENDENT
              key: 'mspdu.outlet.switch[{#OUTLET_INDEX}]'
              history: 7d
              value_type: CHAR
              description: 'The value is normalized to upper case (ON/OFF).'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var lines = value.split('\n');
                      var idx = '{#OUTLET_INDEX}';
                      var re = new RegExp('\\.7\\.' + idx + '\\.0\\s*=\\s*STRING:\\s*"([^"]*)"');
                      for (var i = 0; i < lines.length; i++) {
                          var m = lines[i].match(re);
                          if (m) return m[1].trim().toUpperCase();
                      }
                      return '';
              master_item:
                key: mspdu.walk.outlet.switch.raw
              trigger_prototypes:
                - uuid: b2e1d3c45f6a4b7c8d9e0f1a2b3c4d01
                  expression: 'last(/BKT MSPDU PDU by SNMP/mspdu.outlet.switch[{#OUTLET_INDEX}])<>"{$MSPDU.OUTLET.STATE.ON}" and length(last(/BKT MSPDU PDU by SNMP/mspdu.outlet.switch[{#OUTLET_INDEX}]))>0 and {$MSPDU.OUTLET.OFF.ALERT:"{#OUTLET_INDEX}"}=1'
                  name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): Outlet is switched off'
                  event_name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): Outlet is switched off ({ITEM.VALUE1})'
                  priority: AVERAGE
                  description: 'To silence a specific outlet set {$MSPDU.OUTLET.OFF.ALERT:"{#OUTLET_INDEX}"} = 0.'
                  tags:
                    - tag: scope
                      value: availability
                  dependencies:
                    - name: 'PDU is unavailable by SNMP'
                      expression: 'nodata(/BKT MSPDU PDU by SNMP/mspdu.phase1.current,{$MSPDU.NODATA})=1'
                - uuid: b2e1d3c45f6a4b7c8d9e0f1a2b3c4d02
                  expression: 'last(/BKT MSPDU PDU by SNMP/mspdu.outlet.switch[{#OUTLET_INDEX}],#1)<>last(/BKT MSPDU PDU by SNMP/mspdu.outlet.switch[{#OUTLET_INDEX}],#2) and length(last(/BKT MSPDU PDU by SNMP/mspdu.outlet.switch[{#OUTLET_INDEX}]))>0'
                  name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): Switch state has changed'
                  event_name: 'Outlet {#OUTLET_INDEX} ({#OUTLET_NAME}): Switch state has changed to {ITEM.VALUE1}'
                  priority: INFO
                  description: 'The switch state of the outlet has changed. Acknowledge to close the problem manually.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
              tags:
                - tag: component
                  value: outlet
                - tag: outlet
                  value: '{#OUTLET_INDEX}'
          master_item:
            key: mspdu.walk.outlet.names.raw
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var lines = value.split('\n');
                  var re = /\.5\.(\d+)\.0\s*=\s*STRING:\s*"([^"]*)"/;
                  var result = [];
                  var seen = {};
                  for (var i = 0; i < lines.length; i++) {
                      var m = lines[i].match(re);
                      if (m) {
                          var idx = m[1];
                          var nm = m[2];
                          if (nm === '--' || nm === '') continue;
                          if (seen[idx]) continue;
                          seen[idx] = true;
                          result.push({
                              "{#OUTLET_INDEX}": idx,
                              "{#OUTLET_NAME}": nm
                          });
                      }
                  }
                  return JSON.stringify(result);
      macros:
        - macro: '{$MSPDU.FREQ.MAX}'
          value: '51'
          description: 'Maximum acceptable line frequency, Hz.'
        - macro: '{$MSPDU.FREQ.MIN}'
          value: '49'
          description: 'Minimum acceptable line frequency, Hz.'
        - macro: '{$MSPDU.HUM.MIN}'
          value: '20'
          description: 'Minimum acceptable humidity, %.'
        - macro: '{$MSPDU.NODATA}'
          value: 10m
          description: 'The time interval without data after which the unavailability alarm is raised.'
        - macro: '{$MSPDU.OUTLET.CURRENT.MAX}'
          value: '16'
          description: 'Maximum outlet current, A. The value 0 disables the outlet current triggers, for example when the PDU does not measure the per-outlet current. Can be used with the outlet index as context.'
        - macro: '{$MSPDU.OUTLET.HUM.MAX}'
          value: '80'
          description: 'Maximum acceptable humidity, %.'
        - macro: '{$MSPDU.OUTLET.NOLOAD.PERIOD}'
          value: 15m
          description: 'The evaluation window for the outlet no-load condition. Can be used with the outlet index as context.'
        - macro: '{$MSPDU.OUTLET.OFF.ALERT}'
          value: '1'
          description: 'Alert when an outlet is switched off. Use the context to silence a single outlet, for example {$MSPDU.OUTLET.OFF.ALERT:"5"} = 0.'
        - macro: '{$MSPDU.OUTLET.PF.MIN}'
          value: '0.6'
          description: 'Minimum acceptable outlet power factor.'
        - macro: '{$MSPDU.OUTLET.PF.POWER.MIN}'
          value: '50'
          description: 'Below this power, W, the outlet power factor is ignored.'
        - macro: '{$MSPDU.OUTLET.POWER.MAX}'
          value: '3000'
          description: 'Maximum outlet power, W. The value 0 disables the trigger. Can be used with the outlet index as context.'
        - macro: '{$MSPDU.OUTLET.POWER.MIN}'
          value: '0'
          description: 'Minimum expected outlet power, W. The value 0 disables the "no load" trigger. Set it per outlet, for example {$MSPDU.OUTLET.POWER.MIN:"3"} = 30.'
        - macro: '{$MSPDU.OUTLET.STATE.ON}'
          value: 'ON'
          description: 'The value that means the outlet is switched on. The item normalizes the reading to upper case.'
        - macro: '{$MSPDU.OUTLET.TEMP.MAX}'
          value: '35'
          description: 'Maximum acceptable ambient temperature, °C.'
        - macro: '{$MSPDU.OUTLET.TEMP.MIN}'
          value: '5'
          description: 'Minimum acceptable ambient temperature, °C.'
        - macro: '{$MSPDU.PF.CURRENT.MIN}'
          value: '1'
          description: 'Below this current, A, the phase power factor is ignored.'
        - macro: '{$MSPDU.PF.MIN}'
          value: '0.6'
          description: 'Minimum acceptable phase power factor.'
        - macro: '{$MSPDU.PHASE.CURRENT.MAX}'
          value: '16'
          description: 'Rated input current of the PDU, A. Thresholds: 80% = warning, 100% = high.'
        - macro: '{$MSPDU.SENSOR1.ENABLED}'
          value: '1'
          description: 'Set to 1 if sensor 1 is physically connected, otherwise 0. Prevents false alarms when the reading is 0.'
        - macro: '{$MSPDU.SENSOR2.ENABLED}'
          value: '0'
          description: 'Set to 1 if sensor 2 is physically connected, otherwise 0.'
        - macro: '{$MSPDU.UPTIME.RESTART}'
          value: '600'
          description: 'The uptime value, in seconds, below which a counter drop is treated as a PDU restart.'
        - macro: '{$MSPDU.VOLTAGE.MAX.CRIT}'
          value: '260'
          description: 'Voltage: upper critical threshold, V.'
        - macro: '{$MSPDU.VOLTAGE.MAX.WARN}'
          value: '253'
          description: 'Voltage: upper warning threshold, V (230 V +10%).'
        - macro: '{$MSPDU.VOLTAGE.MIN.CRIT}'
          value: '195'
          description: 'Voltage: lower critical threshold, V.'
        - macro: '{$MSPDU.VOLTAGE.MIN.WARN}'
          value: '207'
          description: 'Voltage: lower warning threshold, V (230 V -10%).'
