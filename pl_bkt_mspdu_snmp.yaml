              expression: 'avg(/SNMP Listwa MSPDU BKT/mspdu.sensor.hum2,10m)>{$MSPDU.OUTLET.HUM.MAX} and {$MSPDU.SENSOR2.ENABLED}=1'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/SNMP Listwa MSPDU BKT/mspdu.sensor.hum2,10m)<{$MSPDU.OUTLET.HUM.MAX}-5'
              name: 'MSPDU: Czujnik 2 - wilgotnosc za wysoka (>{$MSPDU.OUTLET.HUM.MAX}%)'
              event_name: 'MSPDU: Czujnik 2 - wilgotnosc {ITEM.VALUE1}%'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: humidity
            - uuid: c3a17f402b6d4e9d8a5b1c7e9f204a08
              expression: 'avg(/SNMP Listwa MSPDU BKT/mspdu.sensor.hum2,10m)<{$MSPDU.HUM.MIN} and {$MSPDU.SENSOR2.ENABLED}=1'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'min(/SNMP Listwa MSPDU BKT/mspdu.sensor.hum2,10m)>{$MSPDU.HUM.MIN}+5'
              name: 'MSPDU: Czujnik 2 - wilgotnosc za niska (<{$MSPDU.HUM.MIN}%)'
              priority: WARNING
              tags:
                - tag: scope
                  value: humidity
          tags:
            - tag: component
              value: sensor2
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2f02
          name: 'MSPDU: RAW walk - prad gniazdek'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.47394.7.1.8.1]'
          key: mspdu.walk.outlet.current.raw
          delay: 1m
          history: '0'
          value_type: TEXT
          tags:
            - tag: component
              value: walk
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2f12
          name: 'MSPDU: RAW walk - energia gniazdek'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.47394.7.1.10]'
          key: mspdu.walk.outlet.energy.raw
          delay: 5m
          history: '0'
          value_type: TEXT
          tags:
            - tag: component
              value: walk
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2f01
          name: 'MSPDU: RAW walk - nazwy gniazdek'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.47394.7.1.5]'
          key: mspdu.walk.outlet.names.raw
          delay: 1h
          history: '0'
          value_type: TEXT
          tags:
            - tag: component
              value: walk
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2f11
          name: 'MSPDU: RAW walk - wspolczynnik mocy gniazdek'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.47394.7.1.9]'
          key: mspdu.walk.outlet.pf.raw
          delay: 1m
          history: '0'
          value_type: TEXT
          tags:
            - tag: component
              value: walk
        - uuid: 0a1b2c3d4e5f4a6b9c7d8e9f0a1b2f07
          name: 'MSPDU: RAW walk - stan przelacznika gniazdek'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.47394.7.1.7]'
          key: mspdu.walk.outlet.switch.raw
          delay: 1m
          history: '0'
          value_type: TEXT
          tags:
            - tag: component
              value: walk
      discovery_rules:
        - uuid: 1b2c3d4e5f6a4b7c9d8e9f0a1b2c3d01
          name: 'MSPDU: Wykrywanie gniazdek'
          type: DEPENDENT
          key: mspdu.outlet.discovery
          description: 'LLD gniazdek; makra: {#OUTLET_INDEX}, {#OUTLET_NAME}'
          master_item:
            key: mspdu.walk.outlet.names.raw
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var lines = value.split('\n');
                  var re = /\.5\.(\d+)\.0\s*=\s*STRING:\s*"([^"]*)"/;
                  var result = [];
                  var seen = {};
                  for (var i = 0; i < lines.length; i++) {
                      var m = lines[i].match(re);
                      if (m) {
                          var idx = m[1];
                          var nm = m[2];
                          if (nm === '--' || nm === '') continue;
                          if (seen[idx]) continue;
                          seen[idx] = true;
                          result.push({
                              "{#OUTLET_INDEX}": idx,
                              "{#OUTLET_NAME}": nm
                          });
                      }
                  }
                  return JSON.stringify(result);
          item_prototypes:
            - uuid: 2c3d4e5f6a7b4c8d9e0f1a2b3c4d5e01
              name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) - Nazwa'
              type: DEPENDENT
              key: 'mspdu.outlet.name[{#OUTLET_INDEX}]'
              history: 30d
              value_type: CHAR
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var lines = value.split('\n');
                      var idx = '{#OUTLET_INDEX}';
                      var re = new RegExp('\\.5\\.' + idx + '\\.0\\s*=\\s*STRING:\\s*"([^"]*)"');
                      for (var i = 0; i < lines.length; i++) {
                          var m = lines[i].match(re);
                          if (m) return m[1];
                      }
                      return '';
              master_item:
                key: mspdu.walk.outlet.names.raw
              tags:
                - tag: component
                  value: outlet
                - tag: outlet
                  value: '{#OUTLET_INDEX}'
            - uuid: 2c3d4e5f6a7b4c8d9e0f1a2b3c4d5e09
              name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) - Przelacznik'
              type: DEPENDENT
              key: 'mspdu.outlet.switch[{#OUTLET_INDEX}]'
              history: 7d
              value_type: CHAR
              description: 'Wartosc normalizowana do wielkich liter (ON/OFF).'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var lines = value.split('\n');
                      var idx = '{#OUTLET_INDEX}';
                      var re = new RegExp('\\.7\\.' + idx + '\\.0\\s*=\\s*STRING:\\s*"([^"]*)"');
                      for (var i = 0; i < lines.length; i++) {
                          var m = lines[i].match(re);
                          if (m) return m[1].trim().toUpperCase();
                      }
                      return '';
              master_item:
                key: mspdu.walk.outlet.switch.raw
              trigger_prototypes:
                - uuid: b2e1d3c45f6a4b7c8d9e0f1a2b3c4d01
                  expression: 'last(/SNMP Listwa MSPDU BKT/mspdu.outlet.switch[{#OUTLET_INDEX}])<>"{$MSPDU.OUTLET.STATE.ON}" and length(last(/SNMP Listwa MSPDU BKT/mspdu.outlet.switch[{#OUTLET_INDEX}]))>0 and {$MSPDU.OUTLET.OFF.ALERT:"{#OUTLET_INDEX}"}=1'
                  name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) - WYLACZONE'
                  event_name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) jest wylaczone ({ITEM.VALUE1})'
                  priority: AVERAGE
                  description: 'Aby wyciszyc konkretne gniazdo ustaw {$MSPDU.OUTLET.OFF.ALERT:"{#OUTLET_INDEX}"} = 0.'
                  tags:
                    - tag: scope
                      value: availability
                  dependencies:
                    - name: 'MSPDU: Brak danych SNMP - listwa nieosiagalna'
                      expression: 'nodata(/SNMP Listwa MSPDU BKT/mspdu.phase1.current,{$MSPDU.NODATA})=1'
                - uuid: b2e1d3c45f6a4b7c8d9e0f1a2b3c4d02
                  expression: 'last(/SNMP Listwa MSPDU BKT/mspdu.outlet.switch[{#OUTLET_INDEX}],#1)<>last(/SNMP Listwa MSPDU BKT/mspdu.outlet.switch[{#OUTLET_INDEX}],#2) and length(last(/SNMP Listwa MSPDU BKT/mspdu.outlet.switch[{#OUTLET_INDEX}]))>0'
                  name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) - zmiana stanu przelacznika'
                  event_name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) -> {ITEM.VALUE1}'
                  priority: INFO
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
              tags:
                - tag: component
                  value: outlet
                - tag: outlet
                  value: '{#OUTLET_INDEX}'
            - uuid: 2c3d4e5f6a7b4c8d9e0f1a2b3c4d5e02
              name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) - Prad'
              type: DEPENDENT
              key: 'mspdu.outlet.current[{#OUTLET_INDEX}]'
              history: 7d
              value_type: FLOAT
              trends: 90d
              units: A
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var lines = value.split('\n');
                      var idx = '{#OUTLET_INDEX}';
                      var re = new RegExp('\\.8\\.1\\.' + idx + '\\.0\\s*=\\s*STRING:\\s*"([^"]*)"');
                      for (var i = 0; i < lines.length; i++) {
                          var m = lines[i].match(re);
                          if (m) {
                              if (m[1] === '--') return 0;
                              var v = parseFloat(m[1]);
                              return isNaN(v) ? 0 : v;
                          }
                      }
                      return 0;
              master_item:
                key: mspdu.walk.outlet.current.raw
              trigger_prototypes:
                - uuid: b2e1d3c45f6a4b7c8d9e0f1a2b3c4d04
                  expression: '{$MSPDU.OUTLET.CURRENT.MAX:"{#OUTLET_INDEX}"}>0 and min(/SNMP Listwa MSPDU BKT/mspdu.outlet.current[{#OUTLET_INDEX}],3m)>{$MSPDU.OUTLET.CURRENT.MAX:"{#OUTLET_INDEX}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/SNMP Listwa MSPDU BKT/mspdu.outlet.current[{#OUTLET_INDEX}],5m)<{$MSPDU.OUTLET.CURRENT.MAX:"{#OUTLET_INDEX}"}*0.9'
                  name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) - PRZECIAZENIE pradowe'
                  event_name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) - {ITEM.VALUE1} A'
                  priority: HIGH
                  tags:
                    - tag: scope
                      value: capacity
                  dependencies:
                    - name: 'MSPDU: Brak danych SNMP - listwa nieosiagalna'
                      expression: 'nodata(/SNMP Listwa MSPDU BKT/mspdu.phase1.current,{$MSPDU.NODATA})=1'
                - uuid: b2e1d3c45f6a4b7c8d9e0f1a2b3c4d03
                  expression: '{$MSPDU.OUTLET.CURRENT.MAX:"{#OUTLET_INDEX}"}>0 and min(/SNMP Listwa MSPDU BKT/mspdu.outlet.current[{#OUTLET_INDEX}],5m)>{$MSPDU.OUTLET.CURRENT.MAX:"{#OUTLET_INDEX}"}*0.8'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/SNMP Listwa MSPDU BKT/mspdu.outlet.current[{#OUTLET_INDEX}],5m)<{$MSPDU.OUTLET.CURRENT.MAX:"{#OUTLET_INDEX}"}*0.75'
                  name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) - prad > 80% limitu'
                  event_name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) - {ITEM.VALUE1} A'
                  priority: WARNING
                  tags:
                    - tag: scope
                      value: capacity
                  dependencies:
                    - name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) - PRZECIAZENIE pradowe'
                      expression: '{$MSPDU.OUTLET.CURRENT.MAX:"{#OUTLET_INDEX}"}>0 and min(/SNMP Listwa MSPDU BKT/mspdu.outlet.current[{#OUTLET_INDEX}],3m)>{$MSPDU.OUTLET.CURRENT.MAX:"{#OUTLET_INDEX}"}'
                      recovery_expression: 'max(/SNMP Listwa MSPDU BKT/mspdu.outlet.current[{#OUTLET_INDEX}],5m)<{$MSPDU.OUTLET.CURRENT.MAX:"{#OUTLET_INDEX}"}*0.9'
                    - name: 'MSPDU: Brak danych SNMP - listwa nieosiagalna'
                      expression: 'nodata(/SNMP Listwa MSPDU BKT/mspdu.phase1.current,{$MSPDU.NODATA})=1'
              tags:
                - tag: component
                  value: outlet
                - tag: outlet
                  value: '{#OUTLET_INDEX}'
            - uuid: 2c3d4e5f6a7b4c8d9e0f1a2b3c4d5e07
              name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) - Wspolczynnik mocy'
              type: DEPENDENT
              key: 'mspdu.outlet.pf[{#OUTLET_INDEX}]'
              history: 7d
              value_type: FLOAT
              trends: 90d
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var lines = value.split('\n');
                      var idx = '{#OUTLET_INDEX}';
                      var re = new RegExp('\\.9\\.' + idx + '\\.0\\s*=\\s*STRING:\\s*"([^"]*)"');
                      for (var i = 0; i < lines.length; i++) {
                          var m = lines[i].match(re);
                          if (m) {
                              if (m[1] === '--') return 0;
                              var v = parseFloat(m[1]);
                              return isNaN(v) ? 0 : v;
                          }
                      }
                      return 0;
              master_item:
                key: mspdu.walk.outlet.pf.raw
              trigger_prototypes:
                - uuid: b2e1d3c45f6a4b7c8d9e0f1a2b3c4d08
                  expression: 'avg(/SNMP Listwa MSPDU BKT/mspdu.outlet.pf[{#OUTLET_INDEX}],15m)<{$MSPDU.OUTLET.PF.MIN} and min(/SNMP Listwa MSPDU BKT/mspdu.outlet.power.w[{#OUTLET_INDEX}],15m)>{$MSPDU.OUTLET.PF.POWER.MIN}'
                  name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) - niski PF (<{$MSPDU.OUTLET.PF.MIN})'
                  priority: INFO
                  manual_close: 'YES'
                  description: 'Oceniane tylko przy mocy > {$MSPDU.OUTLET.PF.POWER.MIN} W - bez obciazenia PF=0 jest normalne.'
                  tags:
                    - tag: scope
                      value: power
                  dependencies:
                    - name: 'MSPDU: Brak danych SNMP - listwa nieosiagalna'
                      expression: 'nodata(/SNMP Listwa MSPDU BKT/mspdu.phase1.current,{$MSPDU.NODATA})=1'
              tags:
                - tag: component
                  value: outlet
                - tag: outlet
                  value: '{#OUTLET_INDEX}'
            - uuid: 2c3d4e5f6a7b4c8d9e0f1a2b3c4d5e13
              name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) - Moc'
              type: CALCULATED
              key: 'mspdu.outlet.power.w[{#OUTLET_INDEX}]'
              delay: 1m
              history: 7d
              value_type: FLOAT
              trends: 90d
              units: W
              params: 'last(//mspdu.outlet.current[{#OUTLET_INDEX}]) * last(//mspdu.phase1.voltage) * last(//mspdu.outlet.pf[{#OUTLET_INDEX}])'
              description: |
                Moc chwilowa gniazda {#OUTLET_INDEX} = Prad x Napiecie x PF, zaokraglona do W.
                UWAGA: jesli listwa nie raportuje pradu per gniazdo, ta wartosc bedzie stale 0.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = parseFloat(value);
                      if (isNaN(v)) return 0;
                      return Math.round(v);
              trigger_prototypes:
                - uuid: b2e1d3c45f6a4b7c8d9e0f1a2b3c4d06
                  expression: '{$MSPDU.OUTLET.POWER.MAX:"{#OUTLET_INDEX}"}>0 and min(/SNMP Listwa MSPDU BKT/mspdu.outlet.power.w[{#OUTLET_INDEX}],5m)>{$MSPDU.OUTLET.POWER.MAX:"{#OUTLET_INDEX}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/SNMP Listwa MSPDU BKT/mspdu.outlet.power.w[{#OUTLET_INDEX}],5m)<{$MSPDU.OUTLET.POWER.MAX:"{#OUTLET_INDEX}"}*0.9'
                  name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) - moc powyzej limitu'
                  event_name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) - {ITEM.VALUE1} W'
                  priority: WARNING
                  tags:
                    - tag: scope
                      value: capacity
                  dependencies:
                    - name: 'MSPDU: Brak danych SNMP - listwa nieosiagalna'
                      expression: 'nodata(/SNMP Listwa MSPDU BKT/mspdu.phase1.current,{$MSPDU.NODATA})=1'
                - uuid: b2e1d3c45f6a4b7c8d9e0f1a2b3c4d09
                  expression: '{$MSPDU.OUTLET.POWER.MIN:"{#OUTLET_INDEX}"}>0 and max(/SNMP Listwa MSPDU BKT/mspdu.outlet.power.w[{#OUTLET_INDEX}],{$MSPDU.OUTLET.NOLOAD.PERIOD:"{#OUTLET_INDEX}"})<{$MSPDU.OUTLET.POWER.MIN:"{#OUTLET_INDEX}"} and last(/SNMP Listwa MSPDU BKT/mspdu.outlet.switch[{#OUTLET_INDEX}])="{$MSPDU.OUTLET.STATE.ON}"'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'min(/SNMP Listwa MSPDU BKT/mspdu.outlet.power.w[{#OUTLET_INDEX}],5m)>={$MSPDU.OUTLET.POWER.MIN:"{#OUTLET_INDEX}"}'
                  name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) - brak obciazenia mimo zalaczenia'
                  event_name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) - {ITEM.VALUE1} W przy stanie ON'
                  priority: WARNING
                  description: |
                    Prawdopodobna awaria zasilacza lub odlaczenie urzadzenia.
                    Wlacz per gniazdo: {$MSPDU.OUTLET.POWER.MIN:"{#OUTLET_INDEX}"} = np. 20 (W).
                    Wartosc 0 = trigger nieaktywny.
                  tags:
                    - tag: scope
                      value: availability
                  dependencies:
                    - name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) - WYLACZONE'
                      expression: 'last(/SNMP Listwa MSPDU BKT/mspdu.outlet.switch[{#OUTLET_INDEX}])<>"{$MSPDU.OUTLET.STATE.ON}" and length(last(/SNMP Listwa MSPDU BKT/mspdu.outlet.switch[{#OUTLET_INDEX}]))>0 and {$MSPDU.OUTLET.OFF.ALERT:"{#OUTLET_INDEX}"}=1'
                    - name: 'MSPDU: Brak danych SNMP - listwa nieosiagalna'
                      expression: 'nodata(/SNMP Listwa MSPDU BKT/mspdu.phase1.current,{$MSPDU.NODATA})=1'
              tags:
                - tag: component
                  value: outlet
                - tag: outlet
                  value: '{#OUTLET_INDEX}'
            - uuid: 2c3d4e5f6a7b4c8d9e0f1a2b3c4d5e12
              name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) - Energia'
              type: DEPENDENT
              key: 'mspdu.outlet.energy[{#OUTLET_INDEX}]'
              history: 30d
              value_type: FLOAT
              units: kWh
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var lines = value.split('\n');
                      var idx = '{#OUTLET_INDEX}';
                      var re = new RegExp('\\.10\\.' + idx + '\\.0\\s*=\\s*STRING:\\s*"([^"]*)"');
                      for (var i = 0; i < lines.length; i++) {
                          var m = lines[i].match(re);
                          if (m) {
                              if (m[1] === '--') return 0;
                              var v = parseFloat(m[1]);
                              return isNaN(v) ? 0 : v;
                          }
                      }
                      return 0;
              master_item:
                key: mspdu.walk.outlet.energy.raw
              trigger_prototypes:
                - uuid: b2e1d3c45f6a4b7c8d9e0f1a2b3c4d07
                  expression: 'change(/SNMP Listwa MSPDU BKT/mspdu.outlet.energy[{#OUTLET_INDEX}])<0'
                  name: 'MSPDU: Gniazdo {#OUTLET_INDEX} ({#OUTLET_NAME}) - licznik energii wyzerowany'
                  priority: INFO
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
              tags:
                - tag: component
                  value: outlet
                - tag: outlet
                  value: '{#OUTLET_INDEX}'
      macros:
        - macro: '{$MSPDU.NODATA}'
          value: 10m
          description: 'Czas braku danych, po ktorym alarm o nieosiagalnosci.'
        - macro: '{$MSPDU.UPTIME.RESTART}'
          value: '600'
          description: 'Uptime ponizej tej wartosci (s) po spadku licznika = restart listwy.'
        - macro: '{$MSPDU.VOLTAGE.MIN.WARN}'
          value: '207'
          description: 'Napiecie - prog ostrzegawczy dolny (230 V -10%).'
        - macro: '{$MSPDU.VOLTAGE.MIN.CRIT}'
          value: '195'
        - macro: '{$MSPDU.VOLTAGE.MAX.WARN}'
          value: '253'
          description: 'Napiecie - prog ostrzegawczy gorny (230 V +10%).'
        - macro: '{$MSPDU.VOLTAGE.MAX.CRIT}'
          value: '260'
        - macro: '{$MSPDU.FREQ.MIN}'
          value: '49'
        - macro: '{$MSPDU.FREQ.MAX}'
          value: '51'
        - macro: '{$MSPDU.PHASE.CURRENT.MAX}'
          value: '16'
          description: 'Prad znamionowy wejscia listwy (A). Progi: 80% = WARN, 100% = HIGH.'
        - macro: '{$MSPDU.PF.MIN}'
          value: '0.6'
          description: 'Minimalny akceptowalny PF fazy.'
        - macro: '{$MSPDU.PF.CURRENT.MIN}'
          value: '1'
          description: 'Ponizej tego pradu (A) PF fazy jest ignorowany.'
        - macro: '{$MSPDU.OUTLET.STATE.ON}'
          value: 'ON'
          description: 'Wartosc oznaczajaca gniazdo zalaczone. Item normalizuje odczyt do WIELKICH liter.'
        - macro: '{$MSPDU.OUTLET.OFF.ALERT}'
          value: '1'
          description: 'Alarm gdy gniazdo wylaczone. Kontekst: {$MSPDU.OUTLET.OFF.ALERT:"5"} = 0 aby wyciszyc gniazdo 5.'
        - macro: '{$MSPDU.OUTLET.CURRENT.MAX}'
          value: '16'
          description: 'Maksymalny prad gniazda (A). 0 = triggery pradowe wylaczone (np. gdy listwa nie mierzy pradu per gniazdo).'
        - macro: '{$MSPDU.OUTLET.POWER.MAX}'
          value: '3000'
          description: 'Maksymalna moc gniazda (W). 0 = trigger wylaczony.'
        - macro: '{$MSPDU.OUTLET.POWER.MIN}'
          value: '0'
          description: 'Minimalna oczekiwana moc gniazda (W). 0 = trigger "brak obciazenia" WYLACZONY. Ustaw kontekstowo, np. {$MSPDU.OUTLET.POWER.MIN:"3"} = 30.'
        - macro: '{$MSPDU.OUTLET.NOLOAD.PERIOD}'
          value: 15m
          description: 'Okno oceny braku obciazenia gniazda.'
        - macro: '{$MSPDU.OUTLET.PF.MIN}'
          value: '0.6'
          description: 'Minimalny PF gniazda.'
        - macro: '{$MSPDU.OUTLET.PF.POWER.MIN}'
          value: '50'
          description: 'Ponizej tej mocy (W) PF gniazda jest ignorowany.'
        - macro: '{$MSPDU.OUTLET.TEMP.MAX}'
          value: '35'
          description: 'Maksymalna temperatura otoczenia (C).'
        - macro: '{$MSPDU.OUTLET.TEMP.MIN}'
          value: '5'
          description: 'Minimalna temperatura otoczenia (C).'
        - macro: '{$MSPDU.OUTLET.HUM.MAX}'
          value: '80'
          description: 'Maksymalna wilgotnosc (%).'
        - macro: '{$MSPDU.HUM.MIN}'
          value: '20'
          description: 'Minimalna wilgotnosc (%).'
        - macro: '{$MSPDU.SENSOR1.ENABLED}'
          value: '1'
          description: 'Czy czujnik 1 jest fizycznie podlaczony (0/1) - blokuje falszywe alarmy przy odczycie 0.'
        - macro: '{$MSPDU.SENSOR2.ENABLED}'
          value: '0'
          description: 'Czy czujnik 2 jest fizycznie podlaczony (0/1).'
